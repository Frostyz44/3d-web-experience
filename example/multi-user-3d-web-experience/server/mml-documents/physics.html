<!--
  Physics demo for @mml-io/mml-physics.

  This is the template. "npm run build-demo" in packages/mml-physics replaces the script element with the
  mml-physics.js src below with the physics bundle and writes demos/physics.html.
  Serve that with: node packages/mml-cli/build/index.js serve demos/physics.html

  Everything moves through the standard x, y, z, rx, ry and rz attributes. Drag the ball, crates, barrel and block to
  feel their weights and throw them (clients with drag support); everything else works in any MML client.
-->
<html>
<head></head>
<body>
<m-group id="physics-demo">
  <m-light type="point" x="4" y="12" z="8" intensity="900" distance="60" cast-shadows="true"></m-light>
  <m-light type="point" x="-8" y="8" z="-6" intensity="300" distance="40" cast-shadows="false"></m-light>

  <m-text content="Physics" y="3.2" z="-8.6" font-size="0.9" depth="0.15" color="#1d2330"><m-material metalness="0.6" roughness="0.4" emissive="#2ad4ff" emissive-intensity="1.5"></m-material></m-text>
  <!-- Floor and walls. The walls keep bodies in, but users walk over them (collide="false" only affects avatars) -->
  <m-plane id="floor" class="physics-static" rx="-90" width="24" height="18" color="#5f6f7f"></m-plane>
  <m-cube class="physics-static wall" collide="false" x="0" y="0.3" z="-9.2" width="24.8" height="0.6" depth="0.4" color="#3d4752"></m-cube>
  <m-cube class="physics-static wall" collide="false" x="0" y="0.3" z="9.2" width="24.8" height="0.6" depth="0.4" color="#3d4752"></m-cube>
  <m-cube class="physics-static wall" collide="false" x="-12.2" y="0.3" z="0" width="0.4" height="0.6" depth="18" color="#3d4752"></m-cube>
  <m-cube class="physics-static wall" collide="false" x="12.2" y="0.3" z="0" width="0.4" height="0.6" depth="18" color="#3d4752"></m-cube>

  <!-- Ramp, with a block holding up its high end -->
  <m-cube id="ramp" class="physics-static" x="-6.5" y="1.25" z="-2" width="7" height="0.2" depth="3" rz="-20" color="#c98b4a"></m-cube>
  <m-cube class="physics-static" x="-10.2" y="1.25" z="-2" width="0.8" height="2.5" depth="3" color="#8a5d33"></m-cube>

  <!-- Balls that roll down the ramp: light (0.5 kg) and bouncy -->
  <m-sphere class="physics-dynamic ball" x="-9.4" y="3.4" z="-2.8" radius="0.35" color="#e8553e" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>
  <m-sphere class="physics-dynamic ball" x="-9.4" y="3.4" z="-2" radius="0.35" color="#f2b33d" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>
  <m-sphere class="physics-dynamic ball" x="-9.4" y="3.4" z="-1.2" radius="0.35" color="#4cb877" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>
  <m-sphere class="physics-dynamic ball" x="-8.6" y="4.4" z="-2.4" radius="0.35" color="#3d8fe8" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>
  <m-sphere class="physics-dynamic ball" x="-8.6" y="4.4" z="-1.6" radius="0.35" color="#a55ee8" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>

  <!-- A tower and a pyramid of boxes -->
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="2" y="0.4" z="-4" width="0.8" height="0.8" depth="0.8" color="#d9d2c5" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="2" y="1.2" z="-4" width="0.8" height="0.8" depth="0.8" color="#bfb6a6" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="2" y="2" z="-4" width="0.8" height="0.8" depth="0.8" color="#d9d2c5" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="2" y="2.8" z="-4" width="0.8" height="0.8" depth="0.8" color="#bfb6a6" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="2" y="3.6" z="-4" width="0.8" height="0.8" depth="0.8" color="#d9d2c5" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="2" y="4.4" z="-4" width="0.8" height="0.8" depth="0.8" color="#bfb6a6" collide="false"></m-cube>

  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="4.5" y="0.4" z="-4" width="0.8" height="0.8" depth="0.8" color="#9fb4c7" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="5.4" y="0.4" z="-4" width="0.8" height="0.8" depth="0.8" color="#87a0b5" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="6.3" y="0.4" z="-4" width="0.8" height="0.8" depth="0.8" color="#9fb4c7" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="4.95" y="1.2" z="-4" width="0.8" height="0.8" depth="0.8" color="#87a0b5" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="5.85" y="1.2" z="-4" width="0.8" height="0.8" depth="0.8" color="#9fb4c7" collide="false"></m-cube>
  <m-cube class="physics-dynamic stack" physics-friction="0.7" x="5.4" y="2" z="-4" width="0.8" height="0.8" depth="0.8" color="#87a0b5" collide="false"></m-cube>

  <!-- Users near the demo become bodies that push things when they walk into them: light things fly, heavy ones resist -->
  <m-position-probe class="physics-players" range="20" interval="33"></m-position-probe>
  <!--
    Things to drag and throw, from light to very heavy. They slide along the floor, and Shift (or a second finger) lifts
    the ones light enough to lift. Heavier things trail behind the pointer, swing, cannot be thrown as far and barely
    move when pushed. physics-mass is in kilograms; without it the mass comes from the size (physics-density, default
    100 kg per cubic metre).
  -->
  <m-sphere id="beach-ball" class="physics-dynamic throwable" x="-3.5" y="0.5" z="3" radius="0.5" color="#3d8fe8" physics-mass="0.4" physics-bounce="0.8" physics-friction="0.4" drag-enabled="true" drag-plane="ground" drag-preview="true" collide="false"></m-sphere>
  <m-cube id="light-crate" class="physics-dynamic crate throwable" x="-1.5" y="0.3" z="3" width="0.6" height="0.6" depth="0.6" color="#f2b33d" physics-mass="3" drag-enabled="true" drag-plane="ground" drag-preview="true" collide="false"></m-cube>
  <m-cube id="medium-crate" class="physics-dynamic crate throwable" x="0.2" y="0.35" z="3" width="0.7" height="0.7" depth="0.7" color="#c98b4a" physics-mass="20" drag-enabled="true" drag-plane="ground" drag-preview="true" collide="false"></m-cube>
  <m-cylinder id="barrel" class="physics-dynamic throwable" x="1.9" y="0.5" z="3" radius="0.35" height="1" color="#a55ee8" physics-mass="40" drag-enabled="true" drag-plane="ground" drag-preview="true" collide="false"></m-cylinder>
  <m-cube id="heavy-block" class="physics-dynamic throwable" x="4" y="0.45" z="3" width="0.9" height="0.9" depth="0.9" color="#4a5560" physics-mass="250" physics-friction="0.35" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-text content="Ball 0.4 kg" x="-3.5" y="0.18" z="4.1" font-size="0.16" depth="0.03" color="#ffffff"></m-text>
  <m-text content="Crate 3 kg" x="-1.5" y="0.18" z="4.1" font-size="0.16" depth="0.03" color="#ffffff"></m-text>
  <m-text content="Crate 20 kg" x="0.2" y="0.18" z="4.1" font-size="0.16" depth="0.03" color="#ffffff"></m-text>
  <m-text content="Barrel 40 kg" x="1.9" y="0.18" z="4.1" font-size="0.16" depth="0.03" color="#ffffff"></m-text>
  <m-text content="Block 250 kg" x="4" y="0.18" z="4.1" font-size="0.16" depth="0.03" color="#ffffff"></m-text>

  <!-- A kinematic sweeper moved by the script below -->
  <m-cube id="sweeper" class="physics-kinematic" x="9" y="0.4" z="0" width="0.4" height="0.8" depth="3" color="#2f3a45">
    <m-attr-lerp attr="x,y,z,rx,ry,rz" duration="50"></m-attr-lerp>
  </m-cube>
  <m-sphere class="physics-dynamic ball" x="8" y="0.35" z="-1" radius="0.35" color="#e8553e" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>
  <m-sphere class="physics-dynamic ball" x="8" y="0.35" z="1" radius="0.35" color="#f2b33d" physics-mass="0.5" physics-bounce="0.5" physics-friction="0.3" collide="false"></m-sphere>

  <!-- Buttons -->
  <m-group x="-4" y="0" z="6.5">
    <m-cube id="jump-button" y="0.5" width="1.6" height="1" depth="0.4" color="#4cb877"></m-cube>
    <m-text content="Jump" y="0.5" z="0.22" font-size="0.3" depth="0.04" color="#ffffff"></m-text>
  </m-group>
  <m-group x="-1.5" y="0" z="6.5">
    <m-cube id="reset-button" y="0.5" width="1.6" height="1" depth="0.4" color="#e8553e"></m-cube>
    <m-text content="Reset" y="0.5" z="0.22" font-size="0.3" depth="0.04" color="#ffffff"></m-text>
  </m-group>
  <m-text content="Drag the ball, crates, barrel and block: feel the difference in weight&#10;Hold Shift (or use a second finger) to lift" x="3" y="1.6" z="6.5" font-size="0.2" depth="0.04" color="#ffffff"></m-text>
</m-group>

<script>
  // A snappy, game-like feel for this demo: held bodies follow the pointer tightly, throws can be strong, bodies up to
  // about 120 kg can be lifted, and players push harder. Avatars pass through the light bodies (collide="false") so
  // they never get stuck on them; the simulation pushes those bodies away instead. The 250 kg block stays solid.
  window.MMLPhysicsOptions = {
    hold: { response: 45, referenceMass: 30, strength: 2500, lift: 1200, throwImpulse: 300, maxSpeed: 25 },
    players: { strength: 1500 },
  };
</script>

<script>
//<![CDATA[
(function () {
  // Masses and materials are set with physics-* attributes above. The same options can be set from a script with
  // physics.configure(selector, { mass, bounce, friction, linearDamping, angularDamping }).
  var physics = window.MMLPhysics;

  // Remember where everything starts, for the Reset button
  var startStates = [];
  document.querySelectorAll(".physics-dynamic").forEach(function (element) {
    startStates.push({
      element: element,
      x: element.getAttribute("x") || "0",
      y: element.getAttribute("y") || "0",
      z: element.getAttribute("z") || "0",
    });
  });

  document.getElementById("reset-button").addEventListener("click", function () {
    startStates.forEach(function (state) {
      // Writing the attributes moves the body there (and stops it)
      state.element.setAttribute("x", state.x);
      state.element.setAttribute("y", state.y);
      state.element.setAttribute("z", state.z);
      state.element.setAttribute("rx", "0");
      state.element.setAttribute("ry", "0");
      state.element.setAttribute("rz", "0");
    });
  });

  document.getElementById("jump-button").addEventListener("click", function () {
    var i = 0;
    document.querySelectorAll(".physics-dynamic").forEach(function (element) {
      var body = physics.getBody(element);
      var mass = body ? body.mass : 1;
      var angle = i * 2.39996;
      physics.applyImpulse(element, {
        x: Math.cos(angle) * mass,
        y: 5 * mass,
        z: Math.sin(angle) * mass,
      });
      i++;
    });
  });

  // The sweeper slides back and forth, pushing the balls in front of it
  var sweeper = document.getElementById("sweeper");
  var time = 0;
  setInterval(function () {
    time += 1 / 30;
    sweeper.setAttribute("x", (9 - 2.5 + Math.cos(time * 0.7) * 2.5).toFixed(3));
  }, 1000 / 30);
})();
//]]>
</script>
