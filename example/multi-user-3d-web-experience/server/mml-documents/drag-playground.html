<m-group>
  <!--
    Plain drag and drop for the MML fork (github.com/Frostyz44/mml-test), without physics (see the physics area for
    throwing and collisions). Tap a shape to recolour it, drag it to slide it across the floor. It stays where it is
    dropped. Only one player can hold a shape at a time.
  -->
  <m-light type="point" intensity="900" x="4" y="8" z="6" cast-shadows="false"></m-light>
  <m-plane rx="-90" width="14" height="10" color="#7a9a7a"></m-plane>
  <m-text content="Drag playground" y="2.4" z="-4.6" font-size="0.6" depth="0.15" color="#1d2330"><m-material metalness="0.6" roughness="0.4" emissive="#30d060" emissive-intensity="1.5"></m-material></m-text>

  <m-cube class="toy" x="-2.5" y="0.5" color="#d6302b" drag-enabled="true" drag-plane="ground" drag-lift="false" drag-preview="true">
    <!-- Others see the shape glide between the server's position updates instead of jumping -->
    <m-attr-lerp attr="x,z,sx,sy,sz" duration="90" easing="easeOutQuad"></m-attr-lerp>
  </m-cube>
  <m-sphere class="toy" x="0" y="0.5" radius="0.5" color="#2b6bd6" drag-enabled="true" drag-plane="ground" drag-lift="false" drag-preview="true">
    <m-attr-lerp attr="x,z,sx,sy,sz" duration="90" easing="easeOutQuad"></m-attr-lerp>
  </m-sphere>
  <m-cylinder class="toy" x="2.5" y="0.5" color="#e0b030" drag-enabled="true" drag-plane="ground" drag-lift="false" drag-preview="true">
    <m-attr-lerp attr="x,z,sx,sy,sz" duration="90" easing="easeOutQuad"></m-attr-lerp>
  </m-cylinder>

  <script>
    //<![CDATA[
    const palette = ["#d6302b", "#2b6bd6", "#e0b030", "#30a060", "#9040c0"];
    // Shapes stay on the 14 x 10 floor
    const halfWidth = 6.5;
    const halfDepth = 4.5;

    function setScale(toy, scale) {
      toy.setAttribute("sx", scale);
      toy.setAttribute("sy", scale);
      toy.setAttribute("sz", scale);
    }

    for (const toy of document.querySelectorAll(".toy")) {
      // The connection id of the player holding this shape, or null
      let holder = null;
      // Fallback for clients without elementPosition: offset between the shape and the grabbed point
      let grabOffset = { x: 0, z: 0 };
      // Frees the shape if the holder stops sending drag events (for example after a crash)
      let holderTimeout = null;

      function moveTo(detail) {
        const position = detail.elementPosition
          ? detail.elementPosition
          : { x: detail.documentPosition.x + grabOffset.x, z: detail.documentPosition.z + grabOffset.z };
        toy.setAttribute("x", Math.max(-halfWidth, Math.min(halfWidth, position.x)).toFixed(3));
        toy.setAttribute("z", Math.max(-halfDepth, Math.min(halfDepth, position.z)).toFixed(3));
      }

      function keepHolderAlive() {
        clearTimeout(holderTimeout);
        holderTimeout = setTimeout(release, 5000);
      }

      function release() {
        holder = null;
        clearTimeout(holderTimeout);
        setScale(toy, 1);
        // Others may grab it again
        toy.setAttribute("drag-enabled", "true");
      }

      toy.addEventListener("click", () => {
        const next = (palette.indexOf(toy.getAttribute("color")) + 1) % palette.length;
        toy.setAttribute("color", palette[next]);
      });

      toy.addEventListener("dragstart", (event) => {
        if (holder !== null && holder !== event.detail.connectionId) {
          // Someone else is already holding it
          return;
        }
        holder = event.detail.connectionId;
        keepHolderAlive();
        const p = event.detail.documentPosition;
        grabOffset = {
          x: parseFloat(toy.getAttribute("x") || "0") - p.x,
          z: parseFloat(toy.getAttribute("z") || "0") - p.z,
        };
        setScale(toy, 1.15);
        // Nobody else can grab it while it is held
        toy.setAttribute("drag-enabled", "false");
      });

      toy.addEventListener("drag", (event) => {
        if (event.detail.connectionId === holder) {
          keepHolderAlive();
          moveTo(event.detail);
        }
      });

      toy.addEventListener("dragend", (event) => {
        if (event.detail.connectionId !== holder) {
          return;
        }
        // Release first, so the shape is never left locked; it stays exactly where it was dropped
        release();
        moveTo(event.detail);
      });

      // If the holder leaves while holding it, let others grab it again
      window.addEventListener("disconnected", (event) => {
        if (event.detail.connectionId === holder) {
          release();
        }
      });
    }
    //]]>
  </script>
</m-group>
