<!--
  Ball pit demo for @mml-io/mml-physics (template).
  Build with: npm run build-demo -w @mml-io/mml-physics (writes demos/ballpit.html).
  A deep pool of about 450 balls, roughly 1.3 m deep. Climb the steps, jump in and wade through: the simulation pushes
  the balls aside, and you can kick them around and pick them up. Users near the pit become bodies
  in the simulation (physics-players). The balls are created by the script below so that the document stays short.
-->
<html>
<head></head>
<body>
<m-group id="ball-pit">
  <m-light type="point" x="0" y="7" z="4" intensity="500" distance="30" cast-shadows="true"></m-light>
  <m-light type="point" x="-4" y="5" z="-4" intensity="150" distance="20" cast-shadows="false"></m-light>

  <!-- Floor of the pit -->
  <m-plane class="physics-static" rx="-90" y="0.01" width="6" height="6" color="#2f7fd6"></m-plane>

  <!-- Soft padded walls, 1.3 m high, around a 5.2 m square pool -->
  <m-cube class="physics-static" x="0" y="0.65" z="-2.8" width="6" height="1.3" depth="0.4" color="#e8553e">
    <m-material roughness="0.9"></m-material>
  </m-cube>
  <m-cube class="physics-static" x="0" y="0.65" z="2.8" width="6" height="1.3" depth="0.4" color="#f2b33d">
    <m-material roughness="0.9"></m-material>
  </m-cube>
  <m-cube class="physics-static" x="-2.8" y="0.65" z="0" width="0.4" height="1.3" depth="5.2" color="#4cb877">
    <m-material roughness="0.9"></m-material>
  </m-cube>
  <m-cube class="physics-static" x="2.8" y="0.65" z="0" width="0.4" height="1.3" depth="5.2" color="#a55ee8">
    <m-material roughness="0.9"></m-material>
  </m-cube>
  <!-- Two steps up to the wall facing the hub -->
  <m-cube x="3.95" y="0.22" z="0" width="0.9" height="0.44" depth="1.8" color="#d9d2c5"></m-cube>
  <m-cube x="3.4" y="0.44" z="0" width="0.6" height="0.88" depth="1.8" color="#c9c2b5"></m-cube>

  <m-text content="Ball pit" y="3" z="-2.9" font-size="0.7" depth="0.18" color="#1d2330">
    <m-material metalness="0.6" roughness="0.4" emissive="#ff6ad5" emissive-intensity="1.5"></m-material>
  </m-text>
  <m-text content="Climb the steps and jump in" y="2.3" z="-2.9" font-size="0.2" depth="0.04" color="#ffffff"></m-text>

  <!-- Users near the pit push the balls -->
  <m-position-probe class="physics-players" range="12" interval="100"></m-position-probe>

  <m-group id="balls"></m-group>
</m-group>
<script>
  // Soft, light balls: players push them with a person's strength and a snappy hold for picking balls up. Fewer solver
  // iterations keep the many balls cheap to simulate.
  window.MMLPhysicsOptions = {
    solverIterations: 12,
    // A deep pile jiggles for a long time; resting balls fall asleep sooner, so a calm pool costs nothing
    sleepSpeedLimit: 0.35,
    sleepTimeLimit: 0.4,
    hold: { response: 45, referenceMass: 30, strength: 2500, lift: 1200, throwImpulse: 300, maxSpeed: 25 },
  };
</script>

<script>
//<![CDATA[
(function () {
  var colours = ["#e8553e", "#f2b33d", "#4cb877", "#3d8fe8", "#ff6ad5"];
  var group = document.getElementById("balls");
  var radius = 0.2;
  var spacing = 0.42;
  var perRow = 12;
  var total = 450;
  var count = 0;
  // Layers of balls above the floor; they fall and settle when the document starts
  for (var layer = 0; count < total; layer++) {
    for (var row = 0; row < perRow && count < total; row++) {
      for (var column = 0; column < perRow && count < total; column++) {
        var ball = document.createElement("m-sphere");
        ball.setAttribute("class", "physics-dynamic ball");
        ball.setAttribute("radius", String(radius));
        // A little offset per ball so the layers do not stack in perfect columns
        var offset = ((row * 7 + column * 13 + layer * 5) % 10) / 100;
        ball.setAttribute("x", (-2.3 + column * spacing + offset).toFixed(2));
        ball.setAttribute("z", (-2.3 + row * spacing - offset).toFixed(2));
        ball.setAttribute("y", (0.25 + layer * 0.45 + offset).toFixed(2));
        ball.setAttribute("color", colours[count % colours.length]);
        ball.setAttribute("physics-mass", "0.15");
        ball.setAttribute("physics-bounce", "0.25");
        ball.setAttribute("physics-friction", "0.4");
        ball.setAttribute("physics-damping", "0.3");
        ball.setAttribute("physics-angular-damping", "0.6");
        // Avatars do not collide with the balls: hundreds of moving colliders would slow the client down, and the
        // simulation pushes the balls aside as users wade through the pool
        ball.setAttribute("collide", "false");
        ball.setAttribute("drag-enabled", "true");
        ball.setAttribute("drag-preview", "true");
        group.appendChild(ball);
        count++;
      }
    }
  }

  // Ball pit balls are soft and slow: when a user lands in the pool, the balls they displace splash aside instead of
  // shooting away. Limit each moving ball to 4 m/s, and to 2.5 m/s upwards.
  var physics = window.MMLPhysics;
  var balls = Array.prototype.slice.call(group.children);
  setInterval(function () {
    for (var i = 0; i < balls.length; i++) {
      var body = physics.getBody(balls[i]);
      if (!body || body.sleepState === 2) {
        continue;
      }
      var v = body.velocity;
      if (v.y > 2.5) {
        v.y = 2.5;
      }
      var speed = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
      if (speed > 4) {
        v.x *= 4 / speed;
        v.y *= 4 / speed;
        v.z *= 4 / speed;
      }
    }
  }, 1000 / 60);
})();
//]]>
