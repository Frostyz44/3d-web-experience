<!--
  Cinema: an m-youtube screen (MML fork, see scripts/use-mml-fork.mjs) with shared play, pause, restart and skip
  buttons, benches, and physics crates in front of the screen to test occlusion.

  Copy of demos/youtube.html from the MML fork (github.com/Frostyz44/mml-test, generated from
  packages/mml-physics/demo/youtube.html with the mml-physics bundle inlined).

  The buttons only change the screen's start-time and pause-time (document times), so every user sees the same moment
  of the video, including users who join later.

  Video: "Big Buck Bunny" (c) copyright 2008, Blender Foundation, www.bigbuckbunny.org, licensed under the Creative
  Commons Attribution 3.0 licence (CC BY 3.0), on the Blender Foundation's official YouTube channel.
-->
<html>
<head></head>
<body>
<m-group id="youtube-demo">
  <m-light type="point" x="0" y="9" z="6" intensity="700" distance="40" cast-shadows="true"></m-light>
  <m-light type="point" x="-7" y="6" z="-2" intensity="200" distance="30" cast-shadows="false"></m-light>
  <m-light type="point" x="0" y="6" z="13" intensity="250" distance="30" cast-shadows="false"></m-light>

  <!-- Floor and a low wall behind the screen -->
  <m-plane id="floor" class="physics-static" rx="-90" width="22" height="20" z="1" color="#4b5561"></m-plane>
  <m-cube class="physics-static" collide="false" x="0" y="0.3" z="-9.2" width="22" height="0.6" depth="0.4" color="#2d343c"></m-cube>
  <m-cube class="physics-static" collide="false" x="-11.2" y="0.3" z="1" width="0.4" height="0.6" depth="20" color="#2d343c"></m-cube>
  <m-cube class="physics-static" collide="false" x="11.2" y="0.3" z="1" width="0.4" height="0.6" depth="20" color="#2d343c"></m-cube>

  <!-- The screen: frame, the m-youtube element and a back wall -->
  <m-cube x="0" y="4.2" z="-7.15" width="12.6" height="7.35" depth="0.2" color="#15171b"></m-cube>
  <m-youtube id="screen" video-id="aqz-KE-bpKQ" x="0" y="4.2" z="-7" width="12" height="6.75" loop="true" volume="1" load-distance="45"></m-youtube>
  <m-text x="0" y="8.25" z="-7.1" font-size="0.45" depth="0.08" color="#f2f2f2" content="m-youtube"></m-text>
  <m-label x="0" y="0.55" z="-6.95" width="12" height="0.32" font-size="14" alignment="center" color="#15171b" font-color="#c8c8c8" content="Big Buck Bunny (c) Blender Foundation, www.bigbuckbunny.org, CC BY 3.0"></m-label>

  <!-- Crates in front of the screen: they must hide the video where they are in front of it -->
  <m-cube class="physics-dynamic crate" x="-3" y="0.5" z="-4.5" width="1" height="1" depth="1" color="#c98b4a" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-cube class="physics-dynamic crate" x="-3" y="1.5" z="-4.5" width="1" height="1" depth="1" color="#b07a40" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-cube class="physics-dynamic crate" x="-3" y="2.5" z="-4.5" width="1" height="1" depth="1" color="#c98b4a" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-cube class="physics-dynamic crate" x="0.5" y="0.6" z="-3.5" width="1.2" height="1.2" depth="1.2" color="#e8553e" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-cube class="physics-dynamic crate" x="1.9" y="0.6" z="-3.5" width="1.2" height="1.2" depth="1.2" color="#f2b33d" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-cube class="physics-dynamic crate" x="1.2" y="1.8" z="-3.5" width="1.2" height="1.2" depth="1.2" color="#4cb877" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-cube>
  <m-sphere class="physics-dynamic ball" x="4" y="0.6" z="-5" radius="0.6" color="#3d8fe8" drag-enabled="true" drag-plane="ground" drag-preview="true"></m-sphere>


  <!-- Seats: three rows of benches with an aisle in the middle -->
  <m-group x="-5" z="5.5">
    <m-cube y="0.22" width="6" height="0.44" depth="0.9" color="#7a2630"></m-cube>
    <m-cube y="0.75" z="0.4" width="6" height="0.9" depth="0.12" color="#6a1f28"></m-cube>
  </m-group>
  <m-group x="5" z="5.5">
    <m-cube y="0.22" width="6" height="0.44" depth="0.9" color="#7a2630"></m-cube>
    <m-cube y="0.75" z="0.4" width="6" height="0.9" depth="0.12" color="#6a1f28"></m-cube>
  </m-group>
  <m-group x="-5" z="7.5">
    <m-cube y="0.22" width="6" height="0.44" depth="0.9" color="#7a2630"></m-cube>
    <m-cube y="0.75" z="0.4" width="6" height="0.9" depth="0.12" color="#6a1f28"></m-cube>
  </m-group>
  <m-group x="5" z="7.5">
    <m-cube y="0.22" width="6" height="0.44" depth="0.9" color="#7a2630"></m-cube>
    <m-cube y="0.75" z="0.4" width="6" height="0.9" depth="0.12" color="#6a1f28"></m-cube>
  </m-group>
  <m-group x="-5" z="9.5">
    <m-cube y="0.22" width="6" height="0.44" depth="0.9" color="#7a2630"></m-cube>
    <m-cube y="0.75" z="0.4" width="6" height="0.9" depth="0.12" color="#6a1f28"></m-cube>
  </m-group>
  <m-group x="5" z="9.5">
    <m-cube y="0.22" width="6" height="0.44" depth="0.9" color="#7a2630"></m-cube>
    <m-cube y="0.75" z="0.4" width="6" height="0.9" depth="0.12" color="#6a1f28"></m-cube>
  </m-group>

  <!-- Users near the demo push the crates when they walk into them -->
  <m-position-probe class="physics-players" range="20" interval="100"></m-position-probe>

  <!-- Buttons -->
  <m-group x="-4.5" y="0" z="3">
    <m-cube id="back-button" class="button" y="0.5" width="1.4" height="0.8" depth="0.4" color="#5a6470"></m-cube>
    <m-label y="1.2" z="0.21" width="2" height="0.45" font-size="22" alignment="center" content="-10 s"></m-label>
  </m-group>
  <m-group x="-2.5" y="0" z="3">
    <m-cube id="play-button" class="button" y="0.5" width="1.4" height="0.8" depth="0.4" color="#4cb877"></m-cube>
    <m-label y="1.2" z="0.21" width="2" height="0.45" font-size="22" alignment="center" content="Play"></m-label>
  </m-group>
  <m-group x="-0.5" y="0" z="3">
    <m-cube id="pause-button" class="button" y="0.5" width="1.4" height="0.8" depth="0.4" color="#f2b33d"></m-cube>
    <m-label y="1.2" z="0.21" width="2" height="0.45" font-size="22" alignment="center" content="Pause"></m-label>
  </m-group>
  <m-group x="1.5" y="0" z="3">
    <m-cube id="restart-button" class="button" y="0.5" width="1.4" height="0.8" depth="0.4" color="#e8553e"></m-cube>
    <m-label y="1.2" z="0.21" width="2" height="0.45" font-size="22" alignment="center" content="Restart"></m-label>
  </m-group>
  <m-group x="3.5" y="0" z="3">
    <m-cube id="forward-button" class="button" y="0.5" width="1.4" height="0.8" depth="0.4" color="#5a6470"></m-cube>
    <m-label y="1.2" z="0.21" width="2" height="0.45" font-size="22" alignment="center" content="+10 s"></m-label>
  </m-group>
  <m-group x="6" y="0" z="3">
    <m-cube id="reset-button" class="button" y="0.5" width="1.4" height="0.8" depth="0.4" color="#7a5ea8"></m-cube>
    <m-label y="1.2" z="0.21" width="2" height="0.45" font-size="20" alignment="center" content="Reset crates"></m-label>
  </m-group>
  <m-label id="status" x="-8.2" y="1.2" z="3.21" width="3.6" height="0.45" font-size="22" alignment="center" content="Playing"></m-label>
</m-group>

<script>
//<![CDATA[
(function () {
  var physics = window.MMLPhysics;
  physics.configure(".crate", { mass: 1, friction: 0.7 });
  physics.configure(".ball", { mass: 0.6, bounce: 0.5, friction: 0.4 });

  var screen = document.getElementById("screen");
  var statusLabel = document.getElementById("status");

  function now() {
    return Math.round(Number(document.timeline.currentTime));
  }

  function isPaused() {
    return screen.hasAttribute("pause-time");
  }

  // Milliseconds into the video, from the attributes (the same rule every client uses)
  function position() {
    var start = Number(screen.getAttribute("start-time") || 0);
    var end = isPaused() ? Number(screen.getAttribute("pause-time")) : now();
    return Math.max(0, end - start);
  }

  function formatTime(ms) {
    var seconds = Math.floor(ms / 1000);
    var minutes = Math.floor(seconds / 60);
    seconds = seconds % 60;
    return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
  }

  function updateStatus() {
    statusLabel.setAttribute(
      "content",
      (isPaused() ? "Paused at " : "Playing from ") + formatTime(position())
    );
  }

  // Seeks to `ms` into the video, keeping it playing or paused
  function seekTo(ms) {
    ms = Math.max(0, ms);
    if (isPaused()) {
      screen.setAttribute("start-time", String(Number(screen.getAttribute("pause-time")) - ms));
    } else {
      screen.setAttribute("start-time", String(now() - ms));
    }
    updateStatus();
  }

  document.getElementById("play-button").addEventListener("click", function () {
    if (!isPaused()) {
      return;
    }
    var at = position();
    screen.removeAttribute("pause-time");
    screen.setAttribute("start-time", String(now() - at));
    updateStatus();
  });

  document.getElementById("pause-button").addEventListener("click", function () {
    if (isPaused()) {
      return;
    }
    screen.setAttribute("pause-time", String(now()));
    updateStatus();
  });

  document.getElementById("restart-button").addEventListener("click", function () {
    screen.removeAttribute("pause-time");
    screen.setAttribute("start-time", String(now()));
    updateStatus();
  });

  document.getElementById("back-button").addEventListener("click", function () {
    seekTo(position() - 10000);
  });

  document.getElementById("forward-button").addEventListener("click", function () {
    seekTo(position() + 10000);
  });

  // Put the crates back in front of the screen
  var startStates = [];
  document.querySelectorAll(".physics-dynamic").forEach(function (element) {
    startStates.push({
      element: element,
      x: element.getAttribute("x") || "0",
      y: element.getAttribute("y") || "0",
      z: element.getAttribute("z") || "0",
    });
  });
  document.getElementById("reset-button").addEventListener("click", function () {
    startStates.forEach(function (state) {
      state.element.setAttribute("x", state.x);
      state.element.setAttribute("y", state.y);
      state.element.setAttribute("z", state.z);
      state.element.setAttribute("rx", "0");
      state.element.setAttribute("ry", "0");
      state.element.setAttribute("rz", "0");
    });
  });

  screen.setAttribute("start-time", String(now()));
  updateStatus();
})();
//]]>
</script>
</body>
</html>
