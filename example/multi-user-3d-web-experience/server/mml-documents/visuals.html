<!--
  Visual features demo: a TV showing a video through m-material map-video, glass and tinted windows using m-material
  transparency, and solid 3D titles with m-text.

  See demos/README.md for how to run it.

  Assets (all generated for this demo, see demos/assets/visuals/README.md):
    tv-test-pattern.webm  6 second test pattern with a tone
    fence-alpha.jpg       alpha map with diamond holes (used with alpha-test)
    fade-alpha.jpg        alpha map fading from opaque (top) to clear (bottom)
-->
<m-group>
  <m-light type="point" x="-3" y="5" z="5" intensity="60" distance="18" cast-shadows="false"></m-light>
  <m-light type="point" x="4" y="3" z="2" intensity="20" color="#ffe0c0" distance="12" cast-shadows="false"></m-light>

  <!-- Floor -->
  <m-plane rx="-90" width="16" height="12" color="#4a4f5c"></m-plane>

  <!-- Title -->
  <m-text content="MML Visuals" y="3.4" z="-2" font-size="0.7" depth="0.25" color="#202428">
    <m-material
      roughness="0.4"
      metalness="0.6"
      emissive-map="/assets/textures/grid_emissive.png"
      emissive-intensity="2"
      repeat-x="3"
      repeat-y="0.5"
    >
      <m-attr-anim attr="emissive-intensity" start="0.6" end="3" duration="1500" ping-pong="true"></m-attr-anim>
    </m-material>
  </m-text>


  <!-- TV: the m-video controls playback, sync and positional audio, and is hidden. The screen shows it via m-material. -->
  <m-group x="-3.2" y="0" z="-1" ry="20">
    <!-- Muted in the shared world: the test pattern's tone would beep at everyone nearby -->
  <m-video id="tv-video" src="/assets/visuals/tv-test-pattern.webm" y="1.35" visible="false" volume="0"></m-video>
    <m-cube y="0.3" width="0.5" height="0.6" depth="0.4" color="#222222"></m-cube>
    <m-cube y="1.35" width="2.1" height="1.3" depth="0.16" color="#1a1a1a">
      <m-material roughness="0.4" metalness="0.2"></m-material>
    </m-cube>
    <m-cube y="1.35" z="0.085" width="1.92" height="1.08" depth="0.01" color="#ffffff">
      <m-material
        map-video="tv-video"
        emissive-map-video="tv-video"
        emissive-intensity="0.6"
        roughness="0.15"
      ></m-material>
    </m-cube>
    <m-text content="Channel MML" y="0.2" z="0.35" font-size="0.12" depth="0.03" color="#ffffff"></m-text>
  </m-group>

  <!-- Coloured objects behind the windows -->
  <m-sphere x="0" y="0.7" z="-2.4" radius="0.6" color="#ff3b3b"></m-sphere>
  <m-cube x="1.6" y="0.6" z="-2.4" width="1" height="1.2" depth="1" color="#3bd16f"></m-cube>
  <m-cylinder x="3.3" y="0.7" z="-2.4" radius="0.45" height="1.4" color="#3b7bff"></m-cylinder>

  <!-- Clear glass pane: low opacity, smooth, double-sided, no shadow -->
  <m-cube x="0.2" y="1.1" z="-1" width="1.9" height="2.2" depth="0.04" color="#e6f3ff" opacity="0.22" cast-shadows="false">
    <m-material roughness="0.05" double-sided="true"></m-material>
  </m-cube>
  <m-text content="Glass" x="0.2" y="2.45" z="-1" font-size="0.18" depth="0.04"></m-text>

  <!-- Tinted window with a frosted top band -->
  <m-group x="2.5" y="1.1" z="-1">
    <m-plane width="1.9" height="2.2" color="#ff9f1a" opacity="0.5" cast-shadows="false">
      <m-material roughness="0.2" double-sided="true"></m-material>
    </m-plane>
    <m-plane y="0.75" z="0.01" width="1.9" height="0.7" color="#ffffff" cast-shadows="false">
      <m-material alpha-map="/assets/visuals/fade-alpha.jpg" roughness="0.6"></m-material>
    </m-plane>
    <m-text content="Tinted" y="1.35" font-size="0.18" depth="0.04"></m-text>
  </m-group>

  <!-- Cut-out fence: alpha-test discards the holes and keeps the rest opaque (including its shadow) -->
  <m-plane x="4.8" y="0.8" z="-1.4" ry="-35" width="1.6" height="1.6" color="#d9d9d9">
    <m-material alpha-map="/assets/visuals/fence-alpha.jpg" alpha-test="0.5" double-sided="true" metalness="0.6" roughness="0.4"></m-material>
  </m-plane>

  <!-- A sign in front: emissive 3D text on a post -->
  <m-cylinder x="0.2" y="0.25" z="1" radius="0.04" height="0.5" color="#666666"></m-cylinder>
  <!-- The TV's video on other shapes and on 3D text: every surface references the one m-video by its id (map-video) -->
  <m-group z="3.8">
    <m-cube x="-4.8" y="0.9" width="1.2" height="1.2" depth="1.2" color="#ffffff">
      <m-material map-video="tv-video" roughness="0.35"></m-material>
      <m-attr-anim attr="ry" start="0" end="360" duration="9000"></m-attr-anim>
    </m-cube>
    <m-sphere x="-2.4" y="0.9" radius="0.7" color="#ffffff">
      <m-material map-video="tv-video" roughness="0.2" metalness="0.1"></m-material>
      <m-attr-anim attr="ry" start="0" end="360" duration="9000"></m-attr-anim>
    </m-sphere>
    <m-cylinder x="0" y="0.9" radius="0.55" height="1.5" color="#ffffff">
      <m-material map-video="tv-video" roughness="0.4"></m-material>
      <m-attr-anim attr="ry" start="0" end="360" duration="9000"></m-attr-anim>
    </m-cylinder>
    <m-text content="VIDEO" x="3.4" y="0.9" font-size="0.75" depth="0.3" color="#ffffff">
      <m-material map-video="tv-video" roughness="0.3"></m-material>
    </m-text>
    <m-text content="One video on any shape (m-material map-video)" y="2.2" font-size="0.18" depth="0.03" color="#ffffff"></m-text>
  </m-group>

  <m-text content="3D text&#10;with m-text" x="0.2" y="0.75" z="1" font-size="0.16" depth="0.06" color="#111111">
    <m-material emissive="#38e1ff" emissive-intensity="1.5"></m-material>
  </m-text>
</m-group>
